<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WIN5買い目メーカー</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>WIN5買い目メーカー</h1>
      <label for="csvFile">CSVファイル</label>
      <input id="csvFile" type="file" accept=".csv,text/csv">
      <label for="patterns">CSVデータ（貼り付け・編集可）</label>
      <textarea id="patterns" rows="8" spellcheck="false" placeholder="1-7-12-5-5&#10;1,3,11,5,13"></textarea>
      <fieldset class="mode-select">
        <legend>入力方式</legend>
        <label class="mode-option selected"><input type="radio" name="mode" value="rows" checked><span>買い目ごと<small>1行ずつセット</small></span></label>
        <label class="mode-option"><input type="radio" name="mode" value="formation"><span>フォーメーション<small>レース別にまとめる</small></span></label>
      </fieldset>
      <div class="actions">
        <button id="apply" class="secondary" type="button" disabled>反映だけ</button>
        <button id="applyAndSet" type="button" disabled>反映後セット</button>
      </div>
      <p id="previewText" class="preview" aria-live="polite">1行に5レース分の馬番を並べるか、WIN1〜WIN5列のCSVを読み込みます。</p>
      <p id="status" role="status">既存の選択はCSVの内容に置き換わります。購入確定は行いません。</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
